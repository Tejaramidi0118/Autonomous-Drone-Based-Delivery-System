<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Airspace</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">Quick Delivery Ops</div>
            <a class="nav-link" href="/pages/admin_dashboard.html">Dashboard</a>
            <a class="nav-link" href="/pages/drones.html">Drones</a>
            <a class="nav-link active" href="/pages/airspace.html">Airspace</a>
            <a class="nav-link" href="/pages/simulation.html">Simulation</a>
            <a class="nav-link" href="/pages/live_map.html">Live Map</a>
            <a class="nav-link" href="#" onclick="logout()">Logout</a>
        </aside>
        <main class="main">
            <div class="topbar"><h1>Airspace Management</h1><button id="clearZone" class="secondary">Clear drawing</button></div>
            <div class="split">
                <div id="map" class="map"></div>
                <div>
                    <form id="zoneForm" class="card">
                        <h3>New restricted zone</h3>
                        <div class="field"><label>Name</label><input name="name" required></div>
                        <div class="field"><label>Type</label><select name="zone_type"><option>airport</option><option>military</option><option>government</option><option>temporary restriction</option></select></div>
                        <button type="submit">Save polygon</button>
                    </form>
                    <p></p>
                    <div id="zonesList"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/api.js"></script><script src="/js/admin.js"></script><script>setupAirspace();</script>
</body>
</html>
