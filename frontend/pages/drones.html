<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drones</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">Drone Ops Admin</div>
            <a class="nav-link" href="/pages/admin_dashboard.html">Dashboard</a>
            <a class="nav-link active" href="/pages/drones.html">Drones</a>
            <a class="nav-link" href="/pages/airspace.html">Airspace</a>
            <a class="nav-link" href="/pages/simulation.html">Simulation</a>
            <a class="nav-link" href="/pages/live_map.html">Live Map</a>
            <a class="nav-link" href="#" onclick="logout()">Logout</a>
        </aside>
        <main class="main">
            <div class="topbar"><h1>Drone Management</h1></div>
            <form id="droneForm" class="card grid">
                <input name="model" placeholder="Model" required>
                <input name="max_payload" type="number" step=".1" placeholder="Max payload" required>
                <input name="max_range" type="number" step=".1" placeholder="Max range" required>
                <input name="current_battery" type="number" value="95" placeholder="Battery" required>
                <input name="latitude" type="number" step=".000001" value="17.4401" required>
                <input name="longitude" type="number" step=".000001" value="78.3489" required>
                <select name="dark_store_id" id="hubOptions"></select>
                <button type="submit">Add drone</button>
            </form>
            <p></p>
            <table class="table"><thead><tr><th>ID</th><th>Model</th><th>Status</th><th>Battery</th><th>Payload</th><th>Location</th><th></th></tr></thead><tbody id="dronesBody"></tbody></table>
        </main>
    </div>
    <script src="/js/api.js"></script><script src="/js/admin.js"></script><script>loadDrones();</script>
</body>
</html>
