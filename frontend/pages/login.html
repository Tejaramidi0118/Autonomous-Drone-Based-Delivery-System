<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Drone Delivery</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-visual">
            <h1>Autonomous Drone Delivery Simulation Platform</h1>
            <p>Hyderabad-only quick commerce and package delivery operations with drone assignment, route safety, telemetry, and analytics.</p>
        </section>
        <section class="auth-card">
            <form id="loginForm" class="form-card">
                <h2>Login</h2>
                <p class="muted">Demo admin: admin@hyd-drone.local / admin123</p>
                <p class="muted">Demo customer: customer@hyd-drone.local / customer123</p>
                <div class="field"><label>Email</label><input name="email" type="email" required></div>
                <div class="field"><label>Password</label><input name="password" type="password" required></div>
                <button type="submit">Login</button>
                <p><a href="/pages/signup.html">Create an account</a></p>
            </form>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
