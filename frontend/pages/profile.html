<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Quick Delivery Service</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">Quick Delivery Service</div>
            <a class="nav-link" href="/pages/customer_dashboard.html">Dashboard</a>
            <a class="nav-link" href="/pages/grocery.html">Groceries</a>
            <a class="nav-link" href="/pages/cart.html">Cart</a>
            <a class="nav-link" href="/pages/send_package.html">Send Package</a>
            <a class="nav-link" href="/pages/orders.html">Orders</a>
            <a class="nav-link active" href="/pages/profile.html">Profile</a>
            <a class="nav-link" href="#" onclick="logout()">Logout</a>
        </aside>
        <main class="main">
            <div class="topbar">
                <h1>Your Profile</h1>
            </div>
            <div class="card" style="max-width: 600px;">
                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
                    <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold;" id="profileInitials">
                        -
                    </div>
                    <div>
                        <h2 id="profileName" style="margin: 0; font-size: 24px;">-</h2>
                        <p id="profileRole" style="margin: 4px 0 0; color: var(--text-secondary); text-transform: capitalize;">-</p>
                    </div>
                </div>
                
                <div class="field">
                    <label>Email Address</label>
                    <input type="text" id="profileEmail" readonly class="form-control" style="background: var(--bg);">
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script>
        requireAuth("customer");
        const user = getUser();
        if (user) {
            document.getElementById("profileName").textContent = user.name;
            document.getElementById("profileEmail").value = user.email;
            document.getElementById("profileRole").textContent = user.role;
            document.getElementById("profileInitials").textContent = user.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }
    </script>
</body>
</html>
